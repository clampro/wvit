<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=Roboto">
    <link rel="stylesheet" href="style.css">    
    <script src="scripts/common.js" defer></script>
    <script src="scripts/history.js" defer></script>
    <link rel="icon" type="image/png" href="favicon.png" />    
    <title>Document</title>
</head>
<body onload="init()">

    <div id="noteTooltip" class="note-tooltip"></div>

    <div class="history-container">
        <div class="history-header" id="history-header">
            <h1 id="histHDTitle"></h1>
            <div class="history-subhd">
                <div class="date-field">
                    <label for="startDate" class="lblStartDate"><h3>από</h3></label>
                    <input type="date" value="" id="startDate" class="input" name="startDate">
                </div>
                <div class="date-field">
                    <label for="endDate" class="lblEndDate"><h3>εώς</h3></label>
                    <input type="date" value="" id="endDate" class="input" name="endDate"> 
                </div>
                <button id="histRefresh" class="histRefresh">
                    <img src="assets/refresh.png" alt="refresh Button">
                </button>
            </div>
        </div>
        <hr>
        <div class="history-table" id="history-table"></div>
        <div class="history-footer" id="history-footer">
            <button id="pdf" class="footerBTN">
                <img src="assets/pdf-export.png" alt="Export as PDF">
            </button>             
            <button id="home" class="footerBTN">
                <img src="assets/home.png" alt="Return to Home Page">
            </button>           
        </div>
    </div>

</body>
</html>
